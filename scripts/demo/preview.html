<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-web-preview 界面示意</title>
<style>
  :root {
    --bg: #16181d;
    --elevated: #1f2229;
    --text: #e6e8eb;
    --text-secondary: #9aa4b2;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #101216;
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
  }

  .shot {
    width: 660px;
    padding: 26px 28px 30px;
    background: #101216;
  }

  .shot-label {
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
    opacity: 0.65;
    margin-bottom: 14px;
  }

  /* 模拟 DSH 右侧栏容器 */
  .sidebar {
    width: 100%;
    border: 1px solid rgba(127, 127, 127, 0.25);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }

  /* ---- 与 lib/client.js 中一致的样式 ---- */
  .wp-root {
    display: flex;
    flex-direction: column;
    height: 372px;
    background: var(--bg);
  }

  .wp-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-bottom: 1px solid rgba(127, 127, 127, 0.22);
    background: var(--elevated);
  }

  .wp-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 28px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid rgba(56, 160, 255, 0.65);
    background: transparent;
    color: var(--text);
    font-size: 12px;
    font-family: var(--mono);
    outline: none;
  }

  .wp-btn {
    height: 28px;
    min-width: 28px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }

  .wp-btn.primary { background: #2f7de1; border-color: #2f7de1; color: #fff; }

  .wp-frame-wrap { flex: 1 1 auto; background: #fff; overflow: hidden; }

  /* 模拟被预览的网页内容 */
  .page {
    background: #f7f8fa;
    color: #1c1f24;
    height: 100%;
    padding: 22px 24px;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }

  .page h1 { margin: 0 0 6px; font-size: 17px; }
  .page p.sub { margin: 0 0 18px; font-size: 12px; color: #6b7280; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .card {
    border: 1px solid #e3e6eb;
    border-radius: 9px;
    background: #fff;
    padding: 12px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .card .title { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .card .meta { font-size: 11px; color: #8b93a1; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; margin-right: 5px; }
</style>
</head>
<body>
  <section class="shot" id="shot-preview">
    <div class="shot-label">右侧栏 · 网页预览</div>
    <div class="sidebar">
      <div class="wp-root">
        <div class="wp-bar">
          <input class="wp-input" value="localhost:5173" readonly />
          <button class="wp-btn primary">打开</button>
          <button class="wp-btn">↻</button>
          <button class="wp-btn">↗</button>
          <button class="wp-btn">⧉</button>
        </div>
        <div class="wp-frame-wrap">
          <div class="page">
            <h1>本地开发预览</h1>
            <p class="sub">页面在 DSH 侧栏里直接加载，不用切到外部浏览器。</p>
            <div class="cards">
              <div class="card">
                <div class="title"><span class="dot"></span>热更新</div>
                <div class="meta">改完保存即刷新</div>
              </div>
              <div class="card">
                <div class="title"><span class="dot"></span>多地址</div>
                <div class="meta">每个地址一个 tab</div>
              </div>
              <div class="card">
                <div class="title"><span class="dot"></span>随时外部打开</div>
                <div class="meta">一键交给浏览器</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
